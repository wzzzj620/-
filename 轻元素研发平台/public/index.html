<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>轻元素·研发平台 · 数据联调</title>
<style>
  :root { --blue:#3370FF; --line:#E5E6EB; --text:#1F2329; --sub:#646A73; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:#F7F8FA; }
  header { background:var(--blue); color:#fff; padding:14px 18px; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header p { margin:4px 0 0; font-size:12px; opacity:.85; }
  main { padding:16px; max-width:1200px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select,button { font:inherit; padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { background:var(--blue); color:#fff; border-color:var(--blue); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .who { font-size:13px; color:var(--sub); }
  .who b { color:var(--text); }
  .log { font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--sub); white-space:pre-wrap; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th,td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#F2F3F5; position:sticky; top:0; }
  .err { color:#D83931; }
</style>
</head>
<body>
<header>
  <h1>轻元素·研发平台 · 数据联调</h1>
  <p>这个页面只做一件事：验证「飞书身份 + 多维表格取数」通了没有。通了再接你的原型。</p>
</header>

<main>
  <div class="card">
    <div class="row">
      <span class="who" id="who">身份：未识别</span>
      <button id="btnLogin" disabled>重新识别身份</button>
      <span class="who" id="env"></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <select id="selTable"><option>加载中…</option></select>
      <button id="btnLoad">取数</button>
      <span class="who" id="stat"></span>
    </div>
  </div>

  <div class="card" id="result"><div class="log">选一张表，点「取数」。</div></div>
</main>

<script src="https://lf-scm-cn.feishucdn.com/lark/op/h5-js-sdk-1.5.48.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var inFeishu = function () { return Boolean(window.h5sdk && window.tt && window.tt.requestAccess); };
var appId = "";

function boot() {
  $("env").textContent = inFeishu() ? "运行环境：飞书客户端内" : "运行环境：普通浏览器（无身份）";

  fetch("/api/config")
    .then(function (r) { return r.json(); })
    .then(function (cfg) { appId = cfg.appId || ""; })
    .catch(function () { $("who").innerHTML = '<span class="err">/api/config 不通</span>'; })
    .then(function () {
      if (inFeishu() && appId) {
        window.h5sdk.ready(function () { login(); });
      } else if (inFeishu()) {
        $("who").innerHTML = '<span class="err">未拿到 appId，检查 FEISHU_APP_ID 环境变量</span>';
      }
      loadTableList();
    });
}

function login() {
  $("btnLogin").disabled = true;
  window.tt.requestAccess({
    appID: appId,
    scopeList: [],            // 空数组 = 只取「当前登录用户身份」；要按人读表再加 bitable:app:readonly
    state: "rd-platform",
    success: function (res) {
      fetch("/api/session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: res.code }),
      })
        .then(function (r) { return r.json(); })
        .then(function (user) {
          if (user.error) throw new Error(user.error);
          $("who").innerHTML = "身份：<b>" + (user.name || user.open_id) + "</b>";
        })
        .catch(function (e) { $("who").innerHTML = '<span class="err">换身份失败：' + e.message + "</span>"; })
        .then(function () { $("btnLogin").disabled = false; });
    },
    fail: function (err) {
      $("who").innerHTML = '<span class="err">授权失败 ' + (err.errno || "") + " " + (err.errString || "") + "</span>";
      $("btnLogin").disabled = false;
    },
  });
}

function loadTableList() {
  fetch("/api/base")
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.tables) throw new Error(j.error || "返回异常");
      $("selTable").innerHTML = j.tables.map(function (t) { return "<option>" + t + "</option>"; }).join("");
    })
    .catch(function (e) {
      $("selTable").innerHTML = "<option>加载失败</option>";
      $("result").innerHTML = '<div class="log err">表名列表失败：' + e.message + "</div>";
    });
}

function render(rows) {
  if (!rows.length) return '<div class="log">0 条记录（表是空的，或者分页没取到）</div>';
  var cols = Object.keys(rows[0]).filter(function (k) { return k !== "record_id"; });
  var head = "<tr><th>#</th>" + cols.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr>";
  var body = rows.map(function (r, i) {
    var cells = cols.map(function (c) {
      var v = r[c];
      if (Array.isArray(v)) v = v.join("、");
      if (v && typeof v === "object") v = JSON.stringify(v);
      return "<td>" + (v == null ? "" : String(v)) + "</td>";
    }).join("");
    return "<tr><td>" + (i + 1) + "</td>" + cells + "</tr>";
  }).join("");
  return "<table>" + head + body + "</table>";
}

function loadRows() {
  var table = $("selTable").value;
  $("btnLoad").disabled = true;
  $("stat").textContent = "读取中…";
  $("result").innerHTML = "";
  fetch("/api/base?table=" + encodeURIComponent(table))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.error) throw new Error(j.error);
      $("stat").textContent = j.count + " 条" + (j.partial ? "（超时截断，仅返回部分）" : "");
      $("result").innerHTML = render(j.rows || []);
    })
    .catch(function (e) {
      $("stat").textContent = "";
      $("result").innerHTML = '<div class="log err">取数失败：' + e.message + "</div>";
    })
    .then(function () { $("btnLoad").disabled = false; });
}

$("btnLoad").addEventListener("click", loadRows);
$("btnLogin").addEventListener("click", login);
boot();
</script>
</body>
</html>
